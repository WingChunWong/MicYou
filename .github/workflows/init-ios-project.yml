name: Init iOS Project

# One-shot workflow: generates the Xcode project via xcodegen and pushes it back.
# Run via: gh workflow run "Init iOS Project" -r <branch>

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  init-ios:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'liberica'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Install xcodegen
      run: brew install xcodegen

    - name: Build Kotlin Frameworks
      run: |
        ./gradlew :composeApp:linkDebugFrameworkIosArm64
        ./gradlew :composeApp:linkDebugFrameworkIosSimulatorArm64

    - name: Generate Xcode Project
      run: |
        cd iosApp
        xcodegen generate --spec project.yml

    - name: Commit and Push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # Stage generated xcodeproj files
        git add iosApp/*.xcodeproj/

        # Only commit if there are changes
        if git diff --cached --quiet; then
          echo "No changes to commit"
        else
          git commit -m "chore: init iOS Xcode project [skip ci]"
          git push
        fi
